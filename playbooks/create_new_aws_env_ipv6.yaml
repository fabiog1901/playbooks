---
- name: CREATE AWS RESOURCES
  hosts: localhost
  connection: local
  gather_facts: no
  become: no
  vars:
    deployment_id: workshop
    region: ca-central-1
    subnets:
      - name: public
        cidr: 10.0.0.0/19
        ipv6_idx: 0
        az_idx: 0
      - name: public
        cidr: 10.0.32.0/19
        ipv6_idx: 1
        az_idx: 1
      - name: public
        cidr: 10.0.64.0/19
        ipv6_idx: 2
        az_idx: 2
      - name: private
        cidr: 10.0.128.0/19
        ipv6_idx: 3
        az_idx: 0
      - name: private
        cidr: 10.0.160.0/19
        ipv6_idx: 4
        az_idx: 1
      - name: private
        cidr: 10.0.192.0/19
        ipv6_idx: 5
        az_idx: 2

  tasks:
    - name: ensure presence of vpc_id with IPv6 CIDR
      ec2_vpc_net:
        name: "{{ deployment_id }}"
        state: present
        cidr_block: 10.0.0.0/16
        ipv6_cidr: true
        region: "{{ region }}"
        tags:
          deployment_id: "{{ deployment_id }}"
      register: _vpc

    - name: get VPC IPv6 CIDR
      set_fact:
        vpc_ipv6_cidr: "{{ _vpc.vpc.ipv6_cidr_block_association_set[0].ipv6_cidr_block }}"

    - name: calculate subnet IPv6 CIDRs
      command:
        argv:
          - python3
          - -c
          - |
            import ipaddress, json
            vpc = ipaddress.ip_network("{{ vpc_ipv6_cidr }}")
            idxs = {{ subnets | map(attribute='ipv6_idx') | list | to_json }}
            blocks = list(vpc.subnets(new_prefix=64))
            print(json.dumps([str(blocks[i]) for i in idxs]))
      changed_when: false
      register: _subnet_ipv6_cidrs

    - name: set subnet IPv6 CIDR list
      set_fact:
        subnet_ipv6_cidrs: "{{ _subnet_ipv6_cidrs.stdout | from_json }}"

    - name: get rtb info
      ec2_vpc_route_table_info:
        region: "{{ region }}"
        filters:
          vpc-id: "{{ _vpc.vpc.id }}"
      register: _rtb

    - name: get region AZs
      aws_az_info:
        region: "{{ region }}"
      register: _region_info

    - name: ensure presence of subnets with IPv4 and IPv6
      ec2_vpc_subnet:
        state: present
        region: "{{ region }}"
        vpc_id: "{{ _vpc.vpc.id }}"
        cidr: "{{ item.cidr }}"
        ipv6_cidr: "{{ subnet_ipv6_cidrs[ansible_loop.index0] }}"
        assign_instances_ipv6: true
        map_public: yes
        az: "{{ _region_info.availability_zones[item.az_idx].zone_name | default(_region_info.availability_zones[0].zone_name) }}"
        tags:
          Name: "{{ item.name }}-{{ _region_info.availability_zones[item.az_idx].zone_name[-1:] | default(_region_info.availability_zones[0].zone_name[-1:]) }}"
          deployment_id: "{{ deployment_id }}"
      register: _subnets
      loop: "{{ subnets }}"
      loop_control:
        extended: true

    - name: ensure presence of igw
      ec2_vpc_igw:
        vpc_id: "{{ _vpc.vpc.id }}"
        state: present
        region: "{{ region }}"
        tags:
          deployment_id: "{{ deployment_id }}"
      register: _igw

    - name: configure rtb with IPv4 and IPv6 internet routes
      ec2_vpc_route_table:
        vpc_id: "{{ _vpc.vpc.id }}"
        region: "{{ region }}"
        state: present
        route_table_id: "{{ _rtb.route_tables[0].id }}"
        tags:
          deployment_id: "{{ deployment_id }}"
        subnets:
          - "{{ _subnets.results[0].subnet.id }}"
          - "{{ _subnets.results[1].subnet.id }}"
          - "{{ _subnets.results[2].subnet.id }}"
          - "{{ _subnets.results[3].subnet.id }}"
        routes:
          - dest: 0.0.0.0/0
            gateway_id: "{{ _igw.gateway_id }}"
          - dest: ::/0
            gateway_id: "{{ _igw.gateway_id }}"

    - name: ensure presence of SG default
      ec2_group:
        name: "{{ deployment_id }}"
        description: "{{ deployment_id }}"
        state: present
        vpc_id: "{{ _vpc.vpc.id }}"
        region: "{{ region }}"
        tags:
          deployment_id: "{{ deployment_id }}"
        rules:
          - proto: tcp
            ports:
              - 22
              - 26257
              - 26357
              - 8080
            cidr_ip:
              - 0.0.0.0/0
          - proto: tcp
            ports:
              - 22
              - 26257
              - 26357
              - 8080
            cidr_ipv6:
              - ::/0